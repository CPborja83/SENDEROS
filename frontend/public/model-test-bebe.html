<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071321">
  <title>PRUEBA · Bebé Azul 3D · Senderos Lajuj</title>

  <!-- Visor 3D estable. Si este script no carga, el botón VOLVER sigue funcionando. -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071321;color:#eef8ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    body{background:radial-gradient(circle at 50% 38%,#163a59 0,#0a2134 44%,#040a11 100%)}

    model-viewer{
      position:fixed;inset:0;width:100%;height:100%;
      --poster-color:transparent;
      background:transparent;
    }

    .top{position:fixed;z-index:10;left:14px;right:14px;top:14px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;pointer-events:none}
    .card{pointer-events:auto;background:rgba(5,17,28,.88);border:1px solid rgba(112,207,255,.38);border-radius:16px;padding:12px 14px;box-shadow:0 12px 35px rgba(0,0,0,.32);backdrop-filter:blur(10px)}
    h1{font-size:18px;margin:0 0 5px}.status{font-size:13px;color:#9df6b1}.note{font-size:12px;opacity:.8;max-width:430px}

    .controls{position:fixed;z-index:10;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:95vw;background:rgba(5,17,28,.90);border:1px solid rgba(112,207,255,.38);border-radius:16px;padding:12px;box-shadow:0 12px 35px rgba(0,0,0,.34)}
    button,a.action{border:1px solid rgba(125,214,255,.45);background:#123451;color:#fff;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer;text-decoration:none;font-size:14px;line-height:1}
    button:hover,a.action:hover{background:#195076}
    a.back{background:#16405e}

    .error{color:#ff9c9c}
    @media(max-width:700px){.top{top:8px;left:8px;right:8px;display:block}.top .card{margin-bottom:7px}.note{display:none}.controls{bottom:8px;padding:9px}button,a.action{padding:10px 11px;font-size:13px}}
  </style>
</head>
<body>

  <model-viewer
    id="viewer"
    src="assets/models/bebe_azul_v2.glb?v=30000"
    alt="Bebé Azul 3D de Senderos Lajuj"
    camera-controls
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="24deg"
    shadow-intensity="1.25"
    shadow-softness="0.8"
    exposure="1.15"
    environment-image="neutral"
    tone-mapping="neutral"
    camera-orbit="0deg 75deg auto"
    min-camera-orbit="auto 10deg auto"
    max-camera-orbit="auto 170deg auto"
    interaction-prompt="none">
  </model-viewer>

  <div class="top">
    <div class="card">
      <h1>🧪 PRUEBA · BEBÉ AZUL 3D</h1>
      <div id="status" class="status">Cargando el modelo nuevo…</div>
    </div>
    <div class="card note">Esta prueba usa el modelo nuevo de 15,000 vértices / 30,000 triángulos. Puedes arrastrarlo directamente con el mouse.</div>
  </div>

  <div class="controls">
    <button type="button" id="left">↶ Girar</button>
    <button type="button" id="toggle">⏸ Detener giro</button>
    <button type="button" id="right">Girar ↷</button>
    <button type="button" id="near">＋ Acercar</button>
    <button type="button" id="far">− Alejar</button>
    <!-- ES UN ENLACE REAL, NO DEPENDE DE JAVASCRIPT -->
    <a class="action back" href="./">← Volver al juego</a>
  </div>

  <script>
  (function(){
    const v=document.getElementById('viewer');
    const status=document.getElementById('status');
    const toggle=document.getElementById('toggle');
    let rotating=true;

    function waitViewer(){
      if(!customElements.get('model-viewer')){
        setTimeout(waitViewer,100);
        return;
      }

      v.addEventListener('load',()=>{
        status.className='status';
        status.textContent='MODELO NUEVO V2 listo · 15,000 vértices · 30,000 triángulos';
        try{v.jumpCameraToGoal?.();}catch(e){}
      });

      v.addEventListener('error',(e)=>{
        status.className='status error';
        status.textContent='Error al abrir el GLB. El botón VOLVER sí funciona aunque falle el visor.';
      });

      document.getElementById('left').onclick=()=>{
        const o=v.getCameraOrbit();
        v.cameraOrbit=`${o.theta-0.35}rad ${o.phi}rad ${o.radius}m`;
        v.jumpCameraToGoal?.();
      };

      document.getElementById('right').onclick=()=>{
        const o=v.getCameraOrbit();
        v.cameraOrbit=`${o.theta+0.35}rad ${o.phi}rad ${o.radius}m`;
        v.jumpCameraToGoal?.();
      };

      document.getElementById('near').onclick=()=>{
        const o=v.getCameraOrbit();
        const r=Math.max(0.2,o.radius*0.82);
        v.cameraOrbit=`${o.theta}rad ${o.phi}rad ${r}m`;
        v.jumpCameraToGoal?.();
      };

      document.getElementById('far').onclick=()=>{
        const o=v.getCameraOrbit();
        const r=o.radius*1.22;
        v.cameraOrbit=`${o.theta}rad ${o.phi}rad ${r}m`;
        v.jumpCameraToGoal?.();
      };

      toggle.onclick=()=>{
        rotating=!rotating;
        v.autoRotate=rotating;
        toggle.textContent=rotating?'⏸ Detener giro':'▶ Activar giro';
      };
    }

    waitViewer();

    // Si el visor externo no carga, avisamos, pero dejamos siempre funcional VOLVER.
    setTimeout(()=>{
      if(!customElements.get('model-viewer')){
        status.className='status error';
        status.textContent='No cargó el visor 3D. Usa ← Volver al juego y vuelve a intentar con conexión a Internet.';
      }
    },8000);
  })();
  </script>
</body>
</html>
